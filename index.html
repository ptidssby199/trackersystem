<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>IDS Tracker System</title>
<meta name="description" content="Pencatat titik lokasi GPS field & gudang petani, offline-first dengan sinkronisasi Firebase." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1c2116" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="IDS Tracker" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <span class="mark"></span>
      <h1>IDS Tracker System</h1>
    </div>
    <p class="login-sub">Field location logging</p>

    <form id="loginForm">
      <div class="field">
        <label for="loginId">ID Pegawai</label>
        <input type="text" id="loginId" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      <div class="login-error" id="loginError"></div>
    </form>

    <div class="login-hint">
      Login pertama kali? Gunakan <strong>admin</strong> / <strong>admin123</strong>,
      lalu buat akun pegawai lain di menu Master Employee.
    </div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="appShell" class="hidden">
  <div class="topbar">
    <div class="topbar-brand"><span class="mark"></span> IDS Tracker System</div>
    <div class="topbar-actions">
      <button id="installBtn" class="icon-btn hidden" title="Pasang aplikasi">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <div class="notif-wrap">
        <button id="notifBellBtn" class="icon-btn" title="Notifikasi">
          <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/></svg>
          <span class="notif-dot hidden" id="notifDot"></span>
        </button>
        <div class="notif-panel hidden" id="notifPanel">
          <div class="notif-panel-head">
            <span>Notifikasi</span>
            <button id="notifClearBtn" class="link-btn">Bersihkan</button>
          </div>
          <div class="notif-list" id="notifList"><div class="empty-state">Belum ada notifikasi.</div></div>
          <button id="notifEnableBtn" class="notif-enable hidden">🔔 Aktifkan notifikasi perangkat</button>
        </div>
      </div>
      <span id="userLabel" class="topbar-user-label"></span>
      <button id="logoutBtn" class="icon-btn" title="Keluar">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </div>

  <div class="layout">
    <div class="main" id="mainContent">
      <!-- pages rendered here by app.js -->
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="bn-item active" data-page="dashboard" title="Dashboard">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="bn-item" data-page="record" title="Catat Lokasi">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      <span>Catat</span>
    </button>
    <button class="bn-item" data-page="area" title="Titik Area">
      <svg viewBox="0 0 24 24"><path d="M5 8l6-4 8 3-4 9-9-1-1-7z"/><circle cx="5" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="11" cy="4" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="7" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="16" r="1.3" fill="currentColor" stroke="none"/><circle cx="6" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>
      <span>Titik Area</span>
    </button>
    <button class="bn-item" data-page="petani" title="Master Petani">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg>
      <span>Petani</span>
    </button>
    <button class="bn-item" data-page="type" title="Type">
      <svg viewBox="0 0 24 24"><path d="M11 3 3 8.5 11 14l8-5.5L11 3Z"/><path d="M3 15.5 11 21l8-5.5"/></svg>
      <span>Type</span>
    </button>
    <button class="bn-item" data-page="employee" title="Master Employee">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.2"/><circle cx="10" cy="10.5" r="1.9"/><path d="M7 16c.6-1.8 1.9-2.7 3-2.7s2.4.9 3 2.7"/><path d="M14.5 9h3M14.5 12h3"/></svg>
      <span>Pegawai</span>
    </button>
    <button class="bn-item" data-page="laporan" title="Laporan">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M20 20H4"/></svg>
      <span>Laporan</span>
    </button>
    <button class="bn-item" data-page="settings" title="Pengaturan">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      <span>Setting</span>
    </button>
    <button class="bn-item" data-page="sync" title="Sinkronisasi">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.6-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.6 5.7L4 16"/><path d="M4 20v-4h4"/></svg>
      <span>Sync</span>
    </button>
    <button class="bn-item" data-page="backup" title="Backup / Restore">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="5" rx="1.3"/><path d="M5 9v8.5A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5V9"/><path d="M10 13.5h4"/></svg>
      <span>Backup</span>
    </button>
  </nav>
</div>

<div id="toastHost"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/db.js"></script>
<script type="module" src="js/sync.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
